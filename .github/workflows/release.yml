name: Release package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.2"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest tests --timeout=90
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Package only runtime files
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("custom_components/packin")
          with ZipFile("packin.zip", "w", ZIP_DEFLATED) as archive:
              for source in sorted(root.rglob("*")):
                  if source.is_file() and "__pycache__" not in source.parts and source.suffix != ".pyc":
                      archive.write(source, Path("packin") / source.relative_to(root))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packin-integration
          path: packin.zip
# Publishing a GitHub release is a separate reviewed step after BOTH architecture
# tests, validation and real acceptance are reconciled for the same commit.
